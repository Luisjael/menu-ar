services:
  - type: web
    name: menu-ar
    runtime: static
    buildCommand: echo "sitio estatico, sin build"
    staticPublishPath: .
    headers:
      # Scene Viewer (Android) y Quick Look (iOS) descargan estos archivos
      # directamente; con el tipo MIME correcto son mucho más confiables.
      - path: /models/*.glb
        name: Content-Type
        value: model/gltf-binary
      - path: /models/*.usdz
        name: Content-Type
        value: model/vnd.usdz+zip
      # Los modelos no cambian: se cachean un año. Si editás uno, cambiale
      # el nombre (mofongo-v2.glb) en vez de purgar la caché.
      - path: /models/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Los menús sí cambian: precios, platos nuevos.
      - path: /data/*
        name: Cache-Control
        value: public, max-age=60, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
